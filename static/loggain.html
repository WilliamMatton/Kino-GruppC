                <form id="loginForm" action="" class="w-50 mx-auto ">

</div>

<div class="mb-3">

</div>
<button type="submit"  class="btn btn-light text-black mt-4 w-100" >Logga in</button>
<p id="responseMessage" class="mt-3 text-center"></p>

 <a  href="signup.html"><p id="message" class="mt-4 text-center ">Inget konto? Klicka här för att registrera dig!</p></a>
<button type="button" class="btn btn-black text-white order border-black mt-1 w-100">Hoppa över</button>
